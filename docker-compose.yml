services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sothuchi
      POSTGRES_USER: sothuchi
      POSTGRES_PASSWORD: demo-local-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sothuchi -d sothuchi"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://sothuchi:demo-local-only@db:5432/sothuchi
      COOKIE_SECURE: "false"
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  app_data:
